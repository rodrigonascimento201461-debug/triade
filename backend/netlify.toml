# A detecção automática de monorepo do Netlify não está funcionando pra essa
# estrutura de pastas (motivo desconhecido — nem "package_path" pela API nem
# o campo "Base directory" da UI mudam o cwd do comando de build, que sempre
# roda em /opt/build/repo). Por isso TUDO aqui é explícito: cd, npm ci, e
# build, numa linha só. Sem isso, o Netlify também pula o "npm ci" automático
# que normalmente faria por conta própria, e o build falha com "next: not
# found" (node_modules nunca instalado).
[build]
command = "cd backend && npm ci && npm run build"
publish = "backend/.next"

[build.environment]
NODE_VERSION = "20"

[[plugins]]
package = "@netlify/plugin-nextjs"
